name: Windows auto-updater validation

on:
  push:
    branches:
      - main
      - feature/windows-auto-stereo-updater
    paths:
      - "Updates/Windows/DiscordStereoAutoUpdater.ps1"
      - "Updates/Windows/Install-AutoUpdater.ps1"
      - "Updates/Windows/Uninstall-AutoUpdater.ps1"
      - "Updates/Windows/auto-update-manifest.json"
      - ".github/workflows/windows-auto-updater-validation.yml"
  pull_request:
    paths:
      - "Updates/Windows/DiscordStereoAutoUpdater.ps1"
      - "Updates/Windows/Install-AutoUpdater.ps1"
      - "Updates/Windows/Uninstall-AutoUpdater.ps1"
      - "Updates/Windows/auto-update-manifest.json"
      - ".github/workflows/windows-auto-updater-validation.yml"

jobs:
  powershell-parse-and-manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts using Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "Updates/Windows/DiscordStereoAutoUpdater.ps1",
            "Updates/Windows/Install-AutoUpdater.ps1",
            "Updates/Windows/Uninstall-AutoUpdater.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "Parsed: $file"
          }
      - name: Validate fail-closed build manifest
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content "Updates/Windows/auto-update-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1) { throw "Unsupported manifest schemaVersion." }
          if ($null -eq $manifest.builds) { throw "Manifest builds array is required." }
          foreach ($profile in $manifest.builds) {
            if ($profile.appVersion -notmatch '^\d+(\.\d+){1,3}$') { throw "Invalid appVersion." }
            if ($profile.sourceSha256 -notmatch '^[a-fA-F0-9]{64}$') { throw "Invalid sourceSha256." }
            if ($profile.patchedSha256 -notmatch '^[a-fA-F0-9]{64}$') { throw "Invalid patchedSha256." }
            if ($profile.enabled -isnot [bool]) { throw "Profile enabled must be a boolean." }
            $payloadUrl = [string]$profile.patchedNodeUrl
            if ([string]::IsNullOrWhiteSpace($payloadUrl)) { throw "patchedNodeUrl is required." }
            $parsedUrl = [uri]$payloadUrl
            if ($parsedUrl.Scheme -ne "https" -or $parsedUrl.Host -ne "raw.githubusercontent.com") { throw "Untrusted patchedNodeUrl host." }
          }
          Write-Host "Manifest schema is valid. Build profiles: $($manifest.builds.Count)"
